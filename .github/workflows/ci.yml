name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: make test CC=${{ matrix.compiler }}
      - name: Build CLI
        run: make CC=${{ matrix.compiler }}

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined behavior sanitizers
        run: make asan
